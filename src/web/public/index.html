<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Global Betting Platform</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="top">
    <h1 data-i18n="ui.title">Global Betting Platform</h1>
    <div class="top-right">
      <select id="lang" aria-label="Language"></select>
      <span id="who" class="muted"></span>
      <button id="logout" hidden data-i18n="ui.logout">Log out</button>
    </div>
  </header>

  <p class="notice" data-i18n="ui.virtual_notice">Virtual mode uses play credits with no monetary value.</p>

  <main>
    <section id="auth" hidden>
      <div class="tabs">
        <button id="tab-login" class="tab active" data-i18n="ui.login">Log in</button>
        <button id="tab-register" class="tab" data-i18n="ui.register">Create account</button>
      </div>
      <form id="auth-form" class="card">
        <label><span data-i18n="ui.username">Username</span><input name="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_]+" /></label>
        <label><span data-i18n="ui.password">Password</span><input name="password" type="password" required minlength="10" autocomplete="current-password" /></label>
        <div id="register-fields" hidden>
          <label><span data-i18n="ui.display_name">Display name</span><input name="displayName" maxlength="64" /></label>
          <label><span data-i18n="ui.country">Country</span><select name="country" id="country-select"></select></label>
          <label><span data-i18n="ui.date_of_birth">Date of birth</span><input name="dateOfBirth" type="date" /></label>
        </div>
        <button type="submit" id="auth-submit" data-i18n="ui.login">Log in</button>
        <p id="auth-error" class="error" role="alert"></p>
      </form>
    </section>

    <section id="app" hidden>
      <div class="bar">
        <div>
          <strong data-i18n="ui.balance">Balance</strong>
          <span id="balance"></span>
        </div>
        <div class="mode">
          <span data-i18n="ui.mode">Mode</span>
          <button class="mode-btn active" data-mode="virtual" data-i18n="ui.mode_virtual">Virtual</button>
          <button class="mode-btn" data-mode="real" data-i18n="ui.mode_real">Real money</button>
        </div>
      </div>
      <p id="mode-note" class="notice-small"></p>

      <nav class="tabs">
        <button class="tab active" data-view="sports" data-i18n="ui.sports">Sports</button>
        <button class="tab" data-view="casino" data-i18n="ui.casino">Casino</button>
        <button class="tab" data-view="wallet" data-i18n="ui.wallet">Wallet</button>
      </nav>

      <section id="view-sports" class="view"><div id="events"></div></section>
      <section id="view-casino" class="view" hidden>
        <div class="card">
          <h2 data-i18n="ui.roll_dice">Roll dice</h2>
          <label><span data-i18n="ui.stake">Stake</span><input id="dice-stake" value="10" inputmode="decimal" /></label>
          <label><span data-i18n="ui.target">Win if roll is below</span><input id="dice-target" type="number" min="2" max="98" value="50" /></label>
          <button id="dice-roll" data-i18n="ui.roll_dice">Roll dice</button>
          <p id="dice-result" aria-live="polite"></p>
        </div>
      </section>
      <section id="view-wallet" class="view" hidden>
        <div class="card"><h2 data-i18n="ui.wallet">Wallet</h2><pre id="wallet-json"></pre></div>
        <div class="card"><h2 data-i18n="ui.not_available">Not available</h2><pre id="availability-json"></pre></div>
      </section>
      <p id="message" class="message" role="status"></p>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
