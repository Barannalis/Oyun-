# Üretim dağıtımı: oyun sunucusu (panel ve yayın ekranı dahil) + Caddy (otomatik TLS).
# Kullanım: cp .env.example .env, değerleri doldurun, sonra `docker compose up -d --build`.
services:
  app:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes:
      - gifts:/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  gifts:
  caddy_data:
  caddy_config:
